<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="bgremoved preview" />
  <title>bgremoved preview</title>
</head>
<body class="bg-bg text-fg overflow-hidden">
  <div id="root"></div>
  <script>
    // Dynamically load the Vite build entry based on manifest (handles hashed filenames)
    fetch('/dist/manifest.json')
      .then(r => r.json())
      .then(manifest => {
        // Find the entry that is marked as entry point
        const entry = Object.values(manifest).find((v: any) => v.isEntry && v.file);
        if (entry) {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = `/dist/${entry.file}`;
          document.body.appendChild(script);
        } else {
          console.error('Vite manifest entry not found');
        }
      })
      .catch(err => console.error('Failed to load Vite manifest', err));
  </script>
</body>
</html>
