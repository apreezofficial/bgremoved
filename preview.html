<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="bgremoved preview" />
  <title>bgremoved preview</title>
</head>
<body class="bg-bg text-fg overflow-hidden">
  <div id="root"></div>
  <!-- Vite builds the entry as a module in the dist folder. The exact filename may contain a hash, but Vite also generates a manifest.
       For a simple preview we can load the generic entry point "index.js" which Vite creates when using the default config. -->
  <script type="module" src="/dist/assets/index.js"></script>
</body>
</html>
